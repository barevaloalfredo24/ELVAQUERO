# =====================================================================
# NGINX - REVERSE PROXY (producción)
# ---------------------------------------------------------------------
# Expone todo en un solo origen (puerto 80):
#   - "/"        -> frontend (Next.js, puerto interno 3000)
#   - "/api/*"   -> backend  (NestJS, puerto interno 4000)
# Usa resolución dinámica (resolver de Docker) para que nginx arranque
# aunque el backend esté temporalmente caído.
# =====================================================================

# DNS interno de Docker para resolver los nombres de servicio en runtime.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    # Límite de subida (imágenes de producto).
    client_max_body_size 10m;

    # API del backend.
    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js).
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
