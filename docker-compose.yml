# =====================================================================
# DOCKER COMPOSE - PRODUCCIÓN
# ---------------------------------------------------------------------
# Orquesta los tres servicios: nginx (reverse proxy), frontend (Next.js)
# y backend (NestJS). La base de datos es EXTERNA (Supabase).
#
#   docker compose up -d --build
#
# Luego accede a:  http://localhost:${HTTP_PORT:-80}
# =====================================================================

services:
  # ----------------------- BACKEND (NestJS) -----------------------
  backend:
    build:
      context: ./backend
    # Toma las credenciales de backend/.env (DATABASE_URL, JWT, Cloudinary,
    # Recurrente, Resend, Google). Crea ese archivo si no existe.
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      # Verifica que el proceso escuche en el puerto 4000.
      test: ["CMD", "node", "-e", "const n=require('net'),s=n.connect(4000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------- FRONTEND (Next.js) -----------------------
  frontend:
    build:
      context: .
      args:
        # Vacío => el navegador usa rutas relativas /api (vía nginx).
        NEXT_PUBLIC_API_URL: ""
        # Client ID de Google OAuth (público; se embebe en el navegador).
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-853712108635-0ufp1tu4fpptfaud2ir62clmi5s5lqpl.apps.googleusercontent.com}"
    environment:
      # El servidor de Next.js (RSC) usa la red interna de Docker.
      - API_URL=http://backend:4000
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      # Verifica que Next.js responda en el puerto 3000.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------- NGINX (proxy) -----------------------
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      # Verifica que nginx sirva el frontend.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
